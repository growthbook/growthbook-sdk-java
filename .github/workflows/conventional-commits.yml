name: Conventional Commits

# Server-side enforcement of the rules in AGENTS.md:
# release-please derives versions and the changelog from commit messages,
# so a malformed type or a hand-edited release file breaks the release.
# Local .githooks cover the same rules but are bypassable (--no-verify).

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Validate PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -Eq '^(feat|fix|refactor|perf|docs|test|build|ci|chore|style|revert)(\([a-zA-Z0-9._/-]+\))?!?: .+' \
            || { echo "::error::PR title must follow Conventional Commits: type(scope)?: summary"; exit 1; }

      # The repo merges PRs with squash + COMMIT_OR_PR_TITLE: only a single-commit PR
      # puts its commit subject on main, so only then does the subject drive release-please.
      # Multi-commit PRs are covered by the PR title check above.
      - name: Validate commit messages (single-commit PRs only)
        if: ${{ github.event.pull_request.commits == 1 }}
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          fail=0
          while IFS= read -r subject; do
            [ -z "$subject" ] && continue
            case "$subject" in
              Merge\ *|Revert\ *|fixup!\ *|squash!\ *) continue ;;
            esac
            echo "$subject" | grep -Eq '^(feat|fix|refactor|perf|docs|test|build|ci|chore|style|revert)(\([a-zA-Z0-9._/-]+\))?!?: .+' \
              || { echo "::error::Not a Conventional Commit: $subject"; fail=1; }
          done <<EOF
          $(git log --format=%s "$base..$head")
          EOF
          exit $fail

      - name: Block hand-edits to release-please-owned files
        if: ${{ !startsWith(github.event.pull_request.head.ref, 'release-please') }}
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          fail=0
          # Three dots: diff from the merge base, so files the base branch gained
          # after the fork (release-please commits) are not reported as PR changes.
          for f in CHANGELOG.md versions.txt lib/src/main/java/growthbook/sdk/java/Version.java; do
            if git diff --name-only "$base...$head" | grep -qx "$f"; then
              echo "::error file=$f::$f is owned by release-please and must not be hand-edited"
              fail=1
            fi
          done
          if git diff --name-only "$base...$head" | grep -qx "gradle.properties"; then
            if git diff -U0 "$base...$head" -- gradle.properties | grep -Eq '^[+-]version='; then
              echo "::error file=gradle.properties::the version= line is owned by release-please"
              fail=1
            fi
          fi
          exit $fail
