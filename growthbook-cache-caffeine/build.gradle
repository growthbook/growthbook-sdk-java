plugins {
    id 'java-library'
    id 'maven-publish'
}

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

// Compiles against the real Java 8 API, so Java 9+ methods fail here instead of at
// runtime on a consumer's Java 8 JVM (source/targetCompatibility alone cannot catch them).
// javac 8 has no --release flag; there the compatibility settings above are already exact.
tasks.withType(JavaCompile).configureEach {
    if (JavaVersion.current().isJava9Compatible()) {
        options.release = 8
    }
}

// Sources are UTF-8; without this javac uses the platform charset and the Windows CI job
// decodes non-ASCII literals differently from the Linux one.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    api project(':lib')

    implementation 'com.github.ben-manes.caffeine:caffeine:2.9.3'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.8.2'
}

java {
    withSourcesJar()
    withJavadocJar()
}

tasks.named('test') {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom {
                name = 'GrowthBook SDK Java Caffeine Cache Adapter'
                description = 'Optional Caffeine cache adapter for the GrowthBook Java SDK'
                url = 'https://github.com/growthbook/growthbook-sdk-java'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://github.com/growthbook/growthbook-sdk-java/blob/main/LICENSE'
                    }
                }
                developers {
                    developer {
                        id = 'growthbook'
                        name = 'GrowthBook'
                        email = 'hello@growthbook.io'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/growthbook/growthbook-sdk-java.git'
                    developerConnection = 'scm:git:ssh://github.com:growthbook/growthbook-sdk-java.git'
                    url = 'https://github.com/growthbook/growthbook-sdk-java'
                }
            }
        }
    }

    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/growthbook/growthbook-sdk-java")
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}
